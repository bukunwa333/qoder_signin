name: Qoder CN Daily Sign-in

on:
  schedule:
    # UTC 02:05 = 北京时间 10:05，GitHub 调度可能延迟。
    - cron: '5 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'run 签到领取；status 只查询并发送通知'
        required: true
        default: run
        type: choice
        options:
          - run
          - status

permissions:
  contents: read

concurrency:
  group: qoder-daily-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sign in and notify DingTalk
        env:
          QODER_ACCOUNTS: ${{ secrets.QODER_ACCOUNTS }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
          QODER_ACTION: ${{ inputs.action || 'run' }}
          PYTHONUNBUFFERED: '1'
        run: python qoder_actions.py --action "$QODER_ACTION"
